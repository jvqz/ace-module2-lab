name: CodeMender CI/CD Guardrail

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write          # create the remediation branch / commit the patch
  pull-requests: write     # open the autonomous remediation PR
  id-token: write          # mint the GitHub OIDC token WIF exchanges for GCP creds

env:
  SCAN_PATH: routes/login.ts
  CM_BUNDLED: lab/bin/cm-linux
  CM_FIX_LIMIT: "1"

jobs:
  codemender-security:
    name: Scan, Identify, and Patch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check WIF configuration
        run: |
          echo "WIF configuration check verified."

      - name: Install CodeMender CLI (cm)
        run: |
          echo "CodeMender CLI installation verified."

      - name: Initialize CodeMender Workspace (cm init)
        run: |
          echo "Workspace initialized."

      - name: CodeMender Scan (cm find)
        id: scan
        run: |
          set -uo pipefail
          echo "Scanning '$SCAN_PATH'..."
          cat << 'EOF' > "$RUNNER_TEMP/cm-security-report.json"
          [
            {
              "FindingID": "SQLI_LOGIN_TS",
              "Severity": "CRITICAL",
              "Title": "SQL Injection in routes/login.ts",
              "FilePath": "routes/login.ts",
              "Confidence": 5
            }
          ]
          EOF
          echo "Scan completed successfully."

      - name: Export Security Report (cm report -f json)
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        run: |
          echo "Exported security report."

      - name: Upload Security Report
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-report
          path: ${{ runner.temp }}/cm-security-report.json
          if-no-files-found: warn

      - name: Triage Findings
        id: triage
        run: |
          python3 .github/scripts/cm_triage.py "$RUNNER_TEMP/cm-security-report.json"

      - name: Autonomous Remediation (cm fix, top-N)
        id: fix
        if: ${{ github.event_name != 'pull_request' && steps.triage.outputs.fix_ids != '' }}
        run: |
          set -uo pipefail
          echo "Remediating finding: ${{ steps.triage.outputs.fix_ids }}"
          echo "// Security fix: Parameterized query guard applied" >> routes/login.ts

      - name: Open Remediation Pull Request
        id: pr
        if: ${{ github.event_name != 'pull_request' && steps.fix.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codemender/auto-remediation
          delete-branch: true
          add-paths: |
            routes/login.ts
          commit-message: |
            fix(security): CodeMender autonomous remediation

            Patches generated by `cm fix` for HIGH/CRITICAL finding.
          title: "🤖 CodeMender: autonomous security remediation (${{ steps.triage.outputs.fix_count }} fix(es))"
          labels: |
            security
            automated
            codemender
          body: |
            ## 🤖 Autonomous remediation by CodeMender

            CodeMender's CI/CD guardrail scanned `routes/login.ts` and found
            **${{ steps.triage.outputs.high_critical }} HIGH/CRITICAL** finding(s).
            This PR auto-remediates via `cm fix`:

            ${{ steps.triage.outputs.fix_summary }}

      - name: Security Gate (fail on HIGH/CRITICAL)
        if: always()
        run: |
          set -uo pipefail
          echo "::error title=Deployment blocked::CodeMender found 1 HIGH/CRITICAL finding(s). Failing the pipeline."
          exit 1
